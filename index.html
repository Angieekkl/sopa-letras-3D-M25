<html lang="es"><head>
<meta charset="UTF-8">
<title>Sopa de Letras 3D - 25 de Mayo</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#0e1620;
    font-family:Arial;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
}

#ui{
    position:absolute;
    top:10px;
    left:10px;
    width:90%;
    max-width:340px;
    background:rgba(0,0,0,0.85);
    color:white;
    padding:14px;
    border-radius:10px;
    z-index:10;
    pointer-events: none; 
}

#ui * {
    pointer-events: auto; 
}

h1{
    margin:0;
    font-size:18px;
    color:#87cefa;
}

ul{
    columns:2;
    padding-left:18px;
    font-size: 13px;
    margin: 8px 0 0 0;
}

li.done{
    text-decoration: line-through;
    color:#7CFC00;
    font-weight: bold;
}

/* --- JOYSTICK VIRTUAL EN LA ESQUINA --- */
#joystick-container {
    position: absolute;
    bottom: 30px;
    right: 30px;
    width: 100px;
    height: 100px;
    background: rgba(255, 255, 255, 0.15);
    border: 3px solid rgba(135, 206, 250, 0.6);
    border-radius: 50%;
    z-index: 20;
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 15px rgba(0,0,0,0.5);
}

#joystick-knob {
    width: 40px;
    height: 40px;
    background: #87cefa;
    border-radius: 50%;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    transition: transform 0.05s linear;
}

/* Indicador de palabra flotante */
#word-preview {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.85);
    color: #fff;
    padding: 12px 25px;
    border-radius: 25px;
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 3px;
    z-index: 10;
    border: 2px solid #87cefa;
    display: none;
}
</style>
</head>

<body>

<div id="ui">
<h1>🇦🇷 Sopa de Letras 3D</h1>
<ul id="list">
<li data-word="REVOLUCION">REVOLUCION</li>
<li data-word="CABILDO">CABILDO</li>
<li data-word="PATRIA">PATRIA</li>
<li data-word="MORENO">MORENO</li>
<li data-word="SAAVEDRA">SAAVEDRA</li>
<li data-word="ESCARAPELA">ESCARAPELA</li>
<li data-word="VIRREY">VIRREY</li>
<li data-word="JUNTA">JUNTA</li>
<li data-word="LIBERTAD">LIBERTAD</li>
<li data-word="ARGENTINA">ARGENTINA</li>
<li data-word="LOCRO">LOCRO</li>
<li data-word="EMPANADAS">EMPANADAS</li>
</ul>
</div>

<div id="joystick-container">
    <div id="joystick-knob"></div>
</div>

<div id="word-preview"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* =========================
   ESCENA Y CONFIGURACIÓN
========================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1620);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 2000);

// Adaptación de tamaño de la esfera según dispositivo (Notebook vs Celular)
function updateCameraDistance() {
    const isMobile = window.innerWidth < 768;
    camera.position.z = isMobile ? 125 : 95; // Aleja la cámara en móviles para achicar la esfera visualmente
}
updateCameraDistance();

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 1.3));

/* =========================
   GRUPO PRINCIPAL Y LETRAS
========================= */
const mainGlobe = new THREE.Group();
scene.add(mainGlobe);

const letterSprites = [];

/* ESFERA FONDO */
const RADIUS = 45;
const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(RADIUS, 64, 64),
    new THREE.MeshBasicMaterial({ color: 0x1b2a4a }) 
);
mainGlobe.add(sphere);

/* MATERIALES ÚNICOS POR LETRA */
function createLetter(char){
    const canvas = document.createElement("canvas");
    canvas.width = 256;
    canvas.height = 256;
    const ctx = canvas.getContext("2d");

    ctx.font = "bold 85px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffffff"; 
    ctx.fillText(char.toUpperCase(),128,128);

    const tex = new THREE.CanvasTexture(canvas);
    const mat = new THREE.SpriteMaterial({ map:tex, transparent:true, color: 0xffffff });
    mat.depthTest = true;
    mat.depthWrite = false;

    const sprite = new THREE.Sprite(mat);
    sprite.scale.set(6.5,6.5,6.5);
    return sprite;
}

function spherical(lat, lon, radius){
    const phi = (90-lat)*Math.PI/180;
    const theta = lon*Math.PI/180;
    return new THREE.Vector3(
        radius * Math.sin(phi) * Math.cos(theta),
        radius * Math.cos(phi),
        radius * Math.sin(phi) * Math.sin(theta)
    );
}

/* GENERACIÓN DE GRILLA INTELIGENTE (EVITA SUPERPOSICIÓN EN LOS POLOS) */
const rows = 22;
const maxCols = 44;
const letters = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ";
let grid = [];

// Tu lógica para ir reduciendo las columnas a medida que nos acercamos a los polos:
for(let i=0; i<rows; i++){
    const lat = 90 - i * 180/(rows-1);
    
    // Calculamos cuántas columnas corresponden a esta latitud para mantener distancias parejas
    let colsInRow = Math.round(maxCols * Math.cos(lat * Math.PI / 180));
    if (colsInRow < 1) colsInRow = 1; // Al menos una letra en el polo absoluto

    for(let j=0; j<colsInRow; j++){
        const lon = j * 360/colsInRow;
        grid.push({ 
            lat, 
            lon, 
            char: letters[Math.floor(Math.random()*letters.length)], 
            isFixed: false,
            rowId: i,
            colId: j,
            colsInRow: colsInRow
        });
    }
}

const words = ["REVOLUCION","CABILDO","PATRIA","MORENO","SAAVEDRA","ESCARAPELA","VIRREY","JUNTA","LIBERTAD","ARGENTINA","LOCRO","EMPANADAS"];

/* UBICACIÓN DE PALABRAS EN LA NUEVA GRILLA LINEAL */
function placeWord(word){
    let placed = false;
    let attempts = 0;
    
    while(!placed && attempts < 200) {
        attempts++;
        
        // Buscamos una fila al azar que no sea el extremo absoluto de los polos
        const targetRow = Math.floor(Math.random() * (rows - 4)) + 2;
        
        // Filtramos las celdas disponibles que pertenezcan a esa fila
        let rowCells = grid.filter(c => c.rowId === targetRow);
        
        if (rowCells.length >= word.length) {
            const startCol = Math.floor(Math.random() * (rowCells.length - word.length));
            
            let canPlace = true;
            for(let k=0; k<word.length; k++) {
                let cell = rowCells[startCol + k];
                if(cell.isFixed && cell.char !== word[k]) {
                    canPlace = false;
                    break;
                }
            }
            
            if(canPlace) {
                for(let k=0; k<word.length; k++) {
                    let cell = rowCells[startCol + k];
                    cell.char = word[k];
                    cell.isFixed = true; 
                }
                placed = true;
            }
        }
    }
}
words.forEach(placeWord);

const OFFSET = 0.8;
grid.forEach((cell, idx)=>{
    const pos = spherical(cell.lat, cell.lon, RADIUS+OFFSET);
    const sprite = createLetter(cell.char);
    sprite.position.copy(pos);
    
    sprite.userData = { 
        id: idx,
        char: cell.char, 
        isLetter: true,
        isFound: false 
    };
    mainGlobe.add(sprite);
    letterSprites.push(sprite); 
});

/* =========================
   SISTEMA DE PARTÍCULAS (CELESTES Y BLANCAS)
========================= */
let particles = [];

function createWordParticles(originPoints) {
    const particleCount = 25;
    
    // Geometría y materiales básicos compartidos para mejor rendimiento
    const pGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);
    const velocities = [];

    // Colores patrios
    const colorWhite = new THREE.Color(0xffffff);
    const colorBlue = new THREE.Color(0x87cefa);

    originPoints.forEach((pos, index) => {
        // Generar partículas por cada letra de la palabra encontrada
        for(let i=0; i<particleCount; i++) {
            const pIndex = i * 3;
            positions[pIndex] = pos.x;
            positions[pIndex+1] = pos.y;
            positions[pIndex+2] = pos.z;

            // Alternar colores blanco y celeste
            const chosenColor = Math.random() > 0.5 ? colorWhite : colorBlue;
            colors[pIndex] = chosenColor.r;
            colors[pIndex+1] = chosenColor.g;
            colors[pIndex+2] = chosenColor.b;

            // Velocidades hacia el exterior con dispersión
            velocities.push(new THREE.Vector3(
                (Math.random() - 0.5) * 1.5,
                (Math.random() - 0.5) * 1.5,
                (Math.random() - 0.5) * 1.5
            ));
        }

        pGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        pGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const pMat = new THREE.PointsMaterial({
            size: 2.5,
            vertexColors: true,
            transparent: true,
            opacity: 1.0,
            depthWrite: false
        });

        const pSystem = new THREE.Points(pGeo, pMat);
        mainGlobe.add(pSystem); // Se añaden al globo para que roten con él

        particles.push({
            system: pSystem,
            velocities: velocities,
            life: 1.0 // Factor de vida/opacidad
        });
    });
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const pData = particles[i];
        pData.life -= 0.02; // Se van desvaneciendo poco a poco

        if (pData.life <= 0) {
            mainGlobe.remove(pData.system);
            pData.system.geometry.dispose();
            pData.system.material.dispose();
            particles.splice(i, 1);
        } else {
            pData.system.material.opacity = pData.life;
            const posArr = pData.system.geometry.attributes.position.array;
            
            // Mover cada partícula según su velocidad asignada
            for (let j = 0; j < pData.velocities.length; j++) {
                posArr[j*3] += pData.velocities[j].x;
                posArr[j*3+1] += pData.velocities[j].y;
                posArr[j*3+2] += pData.velocities[j].z;
            }
            pData.system.geometry.attributes.position.needsUpdate = true;
        }
    }
}


/* =========================
   MECÁNICA: CONECTAR LETRAS
========================= */
let isDrawing = false;
let currentSelectionPath = [];
let selectedWordString = "";
let foundWords = new Set();
let winSpinTimer = 0; // Temporizador para la rotación final rápida

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const previewEl = document.getElementById("word-preview");

function getPointerCoords(e) {
    if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
    return { x: e.clientX, y: e.clientY };
}

function onPointerStart(e) {
    if(e.target.closest('#ui') || e.target.closest('#joystick-container')) return;

    const coords = getPointerCoords(e);
    const hitSprite = getSpriteAtCoords(coords.x, coords.y);

    if (hitSprite && !hitSprite.userData.isFound) {
        isDrawing = true;
        addLetterToPath(hitSprite);
    }
}

function onPointerMove(e) {
    if (!isDrawing) return;

    const coords = getPointerCoords(e);
    const hitSprite = getSpriteAtCoords(coords.x, coords.y);

    if (hitSprite && !hitSprite.userData.isFound) {
        const alreadyInPath = currentSelectionPath.some(s => s.userData.id === hitSprite.userData.id);
        if (!alreadyInPath) {
            addLetterToPath(hitSprite);
        }
    }
}

function onPointerEnd() {
    if (!isDrawing) return;
    isDrawing = false;
    verifyCurrentWord();
}

function getSpriteAtCoords(clientX, clientY) {
    mouse.x = (clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    
    const hits = raycaster.intersectObjects(letterSprites, false);
    return hits.length > 0 ? hits[0].object : null;
}

function addLetterToPath(sprite) {
    currentSelectionPath.push(sprite);
    selectedWordString += sprite.userData.char;

    sprite.material.color.set(0x00e5ff); // Celeste patrio

    previewEl.style.display = "block";
    previewEl.innerText = selectedWordString;
}

function verifyCurrentWord() {
    if (selectedWordString.length === 0) return;

    let isCorrect = false;
    let wordMatched = "";

    for (let w of words) {
        if (!foundWords.has(w) && selectedWordString === w) {
            isCorrect = true;
            wordMatched = w;
            break;
        }
    }

    if (isCorrect) {
        foundWords.add(wordMatched);
        document.querySelector(`[data-word="${wordMatched}"]`).classList.add("done");

        // Extraer posiciones del mundo real de las letras correctas para detonar partículas allí
        const originPositions = currentSelectionPath.map(sprite => sprite.position.clone());
        createWordParticles(originPositions);

        currentSelectionPath.forEach(sprite => {
            sprite.material.color.set(0x00ff66); 
            sprite.userData.isFound = true;       
        });

        // Condición de Victoria: Se encontraron las 12 palabras
        if(foundWords.size === words.length) {
            winSpinTimer = 8000; // 8 segundos activos (en milisegundos)
        }

        resetSelectionState(true);
    } else {
        currentSelectionPath.forEach(sprite => {
            sprite.material.color.set(0xff4d4d); 
        });

        const pathRef = [...currentSelectionPath]; 
        setTimeout(() => {
            pathRef.forEach(sprite => {
                if (!sprite.userData.isFound) {
                    sprite.material.color.set(0xffffff); 
                }
            });
        }, 500);

        resetSelectionState(false);
    }
}

function resetSelectionState(wasCorrect) {
    selectedWordString = "";
    currentSelectionPath = [];
    setTimeout(() => {
        if(!isDrawing) previewEl.style.display = "none";
    }, wasCorrect ? 500 : 0);
}

// Eventos del juego
window.addEventListener("mousedown", onPointerStart);
window.addEventListener("mousemove", onPointerMove);
window.addEventListener("mouseup", onPointerEnd);

window.addEventListener("touchstart", onPointerStart, { passive: true });
window.addEventListener("touchmove", onPointerMove, { passive: true });
window.addEventListener("touchend", onPointerEnd);


/* =========================
   LÓGICA DEL JOYSTICK VIRTUAL
========================= */
const joystickContainer = document.getElementById("joystick-container");
const joystickKnob = document.getElementById("joystick-knob");

let joystickActive = false;
let joystickVector = { x: 0, y: 0 };

function handleJoystickStart(e) {
    joystickActive = true;
    handleJoystickMove(e);
}

function handleJoystickMove(e) {
    if (!joystickActive) return;
    
    const rect = joystickContainer.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    const pointer = (e.touches && e.touches.length > 0) ? e.touches[0] : e;
    
    let deltaX = pointer.clientX - centerX;
    let deltaY = pointer.clientY - centerY;
    
    const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
    const maxDistance = rect.width / 2 - 10; 

    if (distance > maxDistance) {
        deltaX = (deltaX / distance) * maxDistance;
        deltaY = (deltaY / distance) * maxDistance;
    }

    joystickKnob.style.transform = `translate(${deltaX}px, ${deltaY}px)`;

    joystickVector.x = deltaX / maxDistance;
    joystickVector.y = deltaY / maxDistance;
}

function handleJoystickEnd() {
    joystickActive = false;
    joystickVector = { x: 0, y: 0 };
    joystickKnob.style.transform = "translate(0px, 0px)"; 
}

joystickContainer.addEventListener("mousedown", handleJoystickStart);
window.addEventListener("mousemove", handleJoystickMove);
window.addEventListener("mouseup", handleJoystickEnd);

joystickContainer.addEventListener("touchstart", handleJoystickStart, { passive: true });
window.addEventListener("touchmove", handleJoystickMove, { passive: false });
window.addEventListener("touchend", handleJoystickEnd);


/* =========================
   LOOP DE ANIMACIÓN Y TIEMPOS
========================= */
let lastTime = performance.now();

function animate() {
    requestAnimationFrame(animate);

    const now = performance.now();
    const deltaTime = now - lastTime;
    lastTime = now;

    // Actualizaciones físicas de partículas
    updateParticles();

    // Rotación condicionada por el estado de victoria
    if (winSpinTimer > 0) {
        winSpinTimer -= deltaTime;
        // Rota rápidamente de manera festiva en los ejes Y y X
        mainGlobe.rotation.y += 0.08;
        mainGlobe.rotation.x += 0.02;
    } else if (joystickActive) {
        // MEJORA: Velocidad del Joystick reducida a la mitad (multiplicador bajó de 0.04 a 0.02)
        mainGlobe.rotation.y += joystickVector.x * 0.02;
        mainGlobe.rotation.x += joystickVector.y * 0.02;
    }

    renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    updateCameraDistance(); // Re-evalúa distancia de la esfera al rotar o redimensionar
});

</script>
</body></html>
